<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ユニット点検チェック</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5aec2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ユニット点検" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />

  <link rel="manifest" href="./site.webmanifest" />

  <!-- PC / browser -->
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48x48.png" />
  <link rel="icon" href="./favicon.ico" sizes="any" />

  <!-- iPhone / iPad -->
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />

  <style>
    :root {
      --bg:#fff6f8;
      --card:#ffffff;
      --text:#17304f;
      --muted:#6b7280;
      --accent:#1688f8;
      --accent2:#0d6fd5;
      --line:#f0dce3;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
      background:linear-gradient(180deg,#fff 0,#fff5f8 100%);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .card{
      width:min(92vw,430px);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:20px;
      padding:26px 20px;
      box-shadow:0 12px 34px rgba(90,46,65,.08);
      text-align:center;
    }
    .icon{
      width:86px;
      height:86px;
      border-radius:20px;
      display:block;
      margin:0 auto 16px;
      box-shadow:0 7px 20px rgba(125,65,85,.12);
    }
    h1{
      margin:0 0 9px;
      font-size:22px;
      line-height:1.4;
    }
    p{
      margin:0 0 15px;
      color:var(--muted);
      line-height:1.75;
      font-size:14px;
    }
    .btn{
      display:inline-block;
      min-width:230px;
      padding:14px 18px;
      border:none;
      border-radius:14px;
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      color:#fff;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(22,136,248,.20);
    }
    .help{
      margin-top:15px;
      font-size:13px;
      color:var(--muted);
      line-height:1.7;
    }
    .warn{
      display:none;
      margin:12px 0 0;
      padding:10px 12px;
      border-radius:12px;
      background:#fff3cd;
      color:#775a00;
      font-size:13px;
      line-height:1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="./apple-touch-icon.png" alt="ユニット点検チェックのアイコン" />
    <h1>ユニット点検チェック</h1>
    <p id="msg">iPhone・iPadでは、この画面をSafariで開いたまま「共有」→「ホーム画面に追加」を行ってください。</p>
    <button class="btn" id="openBtn" type="button">ユニット点検チェックを開く</button>
    <div class="help">
      ※ ホーム画面に追加するときは、この画面のままで行ってください。
    </div>
    <div class="warn" id="urlWarn">
      GASの公開URLがまだ設定されていません。HTML内の EXEC_URL を差し替えてください。
    </div>
  </div>

  <script>
    const EXEC_URL = 'https://script.google.com/macros/s/AKfycbwqR-x-iu_NPmGjsbsAl1YVP2jd0SIjA72ddmtqsdnP7O9TmfIgJwjrK7wtQWQNUY-x/exec';

    function isStandaloneMode() {
      return window.navigator.standalone === true ||
             window.matchMedia('(display-mode: standalone)').matches;
    }

    function hasRealExecUrl() {
      return EXEC_URL.startsWith('https://script.google.com/macros/s/') &&
             EXEC_URL.endsWith('/exec');
    }

    function openApp() {
      if (!hasRealExecUrl()) {
        document.getElementById('urlWarn').style.display = 'block';
        return;
      }
      const search = window.location.search || '';
      const hash = window.location.hash || '';
      window.location.href = EXEC_URL + search + hash;
    }

    if (isStandaloneMode()) {
      if (hasRealExecUrl()) {
        document.getElementById('msg').textContent = 'アプリを開いています…';
        setTimeout(openApp, 150);
      } else {
        document.getElementById('urlWarn').style.display = 'block';
      }
    }

    document.getElementById('openBtn').addEventListener('click', openApp);
  </script>
</body>
</html>
